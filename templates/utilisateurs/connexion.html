<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - NovaTask</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans', sans-serif; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
</head>
<body class="min-h-screen bg-[#FAFAF8] flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Logo / marque -->
        <div class="text-center mb-8">
            <p class="mono text-xs uppercase tracking-widest text-[#8A8A82]">Nova Org</p>
            <h1 class="text-2xl font-semibold text-[#1C1C1A] mt-1">NovaTask</h1>
        </div>

        <div class="border border-[#1C1C1A] bg-[#FAFAF8]">

            <div class="px-8 pt-8 pb-6 border-b border-[#DEDEDA]">
                <h2 class="text-xl font-semibold text-[#1C1C1A]">Connexion</h2>
                <p class="text-sm text-[#8A8A82] mt-1">Connectez-vous à votre compte</p>
            </div>

            <form method="POST" class="px-8 py-6 space-y-5">
                {% csrf_token %}

                {% if erreur %}
                <div class="border border-[#B8402E] bg-[#B8402E]/5 text-[#B8402E] text-sm px-3 py-2.5">
                    {{ erreur }}
                </div>
                {% endif %}

                <div>
                    <label for="username" class="mono text-xs uppercase tracking-wide text-[#8A8A82] block mb-1.5">
                        Nom d'utilisateur
                    </label>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        required
                        autofocus
                        class="w-full border border-[#DEDEDA] bg-white px-3 py-2.5 text-sm text-[#1C1C1A] focus:outline-none focus:border-[#1C1C1A] transition-colors"
                        placeholder="Entrez votre nom d'utilisateur"
                    >
                </div>

                <div>
                    <label for="password" class="mono text-xs uppercase tracking-wide text-[#8A8A82] block mb-1.5">
                        Mot de passe
                    </label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        required
                        class="w-full border border-[#DEDEDA] bg-white px-3 py-2.5 text-sm text-[#1C1C1A] focus:outline-none focus:border-[#1C1C1A] transition-colors"
                        placeholder="Entrez votre mot de passe"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full mono text-xs uppercase tracking-wide bg-[#1C1C1A] text-white py-3 hover:bg-[#3A3A36] transition-colors">
                    Se connecter
                </button>
            </form>

            <div class="px-8 py-5 border-t border-[#DEDEDA] text-center">
                <p class="text-sm text-[#8A8A82]">
                    Pas encore de compte ?
                    <a href="{% url 'inscription' %}" class="text-[#1C1C1A] font-medium hover:underline">
                        Créer un compte
                    </a>
                </p>
            </div>

        </div>

    </div>

</body>
</html>
