<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supprimer la tâche</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans', sans-serif; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
</head>
<body class="bg-[#FAFAF8] text-[#1C1C1A] min-h-screen flex items-center justify-center">

    <div class="max-w-sm w-full mx-6 border border-[#DEDEDA]">

        <div class="px-6 pt-6 pb-5 border-b border-[#DEDEDA]">
            <p class="mono text-xs uppercase tracking-wider text-[#B03A2E] mb-1">Action irréversible</p>
            <h2 class="text-lg font-semibold">Supprimer la tâche</h2>
        </div>

        <div class="px-6 py-6">
            <p class="text-sm text-[#5C5C54] leading-relaxed">
                Voulez-vous vraiment supprimer la tâche
                <strong class="text-[#1C1C1A] font-medium">{{ tache.intitule }}</strong> ?
                Cette action ne peut pas être annulée.
            </p>
        </div>

        <form method="POST" class="px-6 pb-6 flex gap-3">
            {% csrf_token %}

            <button type="submit"
                class="mono text-xs uppercase tracking-wide bg-[#B03A2E] text-white px-5 py-3 hover:bg-[#8F2E24] transition-colors">
                Oui, supprimer
            </button>

            <a href="{% url 'liste_tache' tache.id_proj.id %}"
                class="mono text-xs uppercase tracking-wide border border-[#DEDEDA] text-[#8A8A82] px-5 py-3 hover:border-[#1C1C1A] hover:text-[#1C1C1A] transition-colors">
                Annuler
            </a>
        </form>

    </div>

</body>
</html>
